plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'checkstyle'
    id 'org.sonarqube' version '7.2.2.6593'
    id 'com.github.ben-manes.versions' version '0.61.0'
    id 'se.patrikerdes.use-latest-versions' version '0.2.19'
}

group = 'com.eudistack'
// Plain version, no SNAPSHOT: the ci job tags the release v${version}
// and refuses to run if that tag already exists.
version = '0.2.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacoco {
    toolVersion = "0.8.14"
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// Spring Boot's dependency-management BOM pins commons-lang3 to 3.17.0 (via
// springdoc -> swagger-core-jakarta), overriding the 3.20.0 that
// dss-utils-apache-commons:6.4 (task 6/7/8) actually requires at runtime
// (org.apache.commons.lang3.Strings.CS/CI, added in 3.18). Left unpinned, any real
// TLValidationJob refresh — onlineRefresh() or offlineRefresh(), both exercised by
// DssOfficialTrustListAdapter — throws NoClassDefFoundError the first time DSS's
// TLValidationJobSummaryBuilder calls Utils.areStringsEqual(), which no unit test
// exercises because DSS itself is mocked there (task 8/9 notes). Found while
// building task 13's fixture-signing tool, which hits the same code path; fixed
// here rather than only worked around locally, since the defect is in production
// wiring, not test tooling. A plain resolutionStrategy.force does not win against
// Spring's dependency-management BOM, hence the explicit override below.
dependencyManagement {
    dependencies {
        dependency 'org.apache.commons:commons-lang3:3.20.0'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // --- Spring Boot Starters ---
    // WebMvc on virtual threads, not WebFlux: the work this service does is a
    // periodic blocking sync (DSS has a fully synchronous API) plus serving a
    // cached snapshot. Reactor would wrap every DSS call in boundedElastic and
    // buy nothing but harder stack traces — see docs/architecture.md AD-7.
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // --- Trusted Lists (ETSI TS 119 612) ---
    // DSS is the European Commission reference implementation for LOTL/TL
    // handling: pivot chains, MRA, TL signature verification and offline cache.
    // Licence: LGPL-2.1 (linked, not modified) — see docs/architecture.md AD-2.
    implementation 'eu.europa.ec.joinup.sd-dss:dss-tsl-validation:6.4'
    implementation 'eu.europa.ec.joinup.sd-dss:dss-service:6.4'
    implementation 'eu.europa.ec.joinup.sd-dss:dss-spi:6.4'
    // dss-tsl-validation's AbstractParsingTask.verifyTLVersionConformity() (LOTL parsing only)
    // needs specs-trusted-list-v211's JAXB-generated classes at runtime. It was never on the
    // production runtimeClasspath, so every unit test that mocks
    // TLValidationJob/TLValidationJobSummary never exercised this code path. Found while
    // building task 15's container test (tasks.md task 15 Notes): any real onlineRefresh()
    // against a genuine LOTL threw NoClassDefFoundError the first time it ran for real, the same
    // category of gap as the commons-lang3 fix in task 13.
    runtimeOnly 'eu.europa.ec.joinup.sd-dss:specs-trusted-list-v211:6.4'
    // dss-xades is already pulled in transitively by dss-tsl-validation (TL/LOTL
    // signature verification is XAdES-BES); declared directly here too because
    // fixtures/tsl/regenerate-fixtures.sh compiles a throwaway signing utility
    // against XAdESService to produce real, DSS-verifiable test fixtures.
    testImplementation 'eu.europa.ec.joinup.sd-dss:dss-xades:6.4'
    // dss-token (PKCS12 keystore-backed signing) is not pulled in by any other
    // declared dependency — only the fixture-signing tool above needs it.
    testImplementation 'eu.europa.ec.joinup.sd-dss:dss-token:6.4'
    // dss-validation carries SignedDocumentValidator. It is NOT test-only: TLValidatorTask,
    // which TLValidationJob itself runs internally to verify every TL/LOTL's signature, needs
    // it at runtime — confirmed while building task 15's container test, where a real
    // onlineRefresh() without this dependency swallowed a NoClassDefFoundError per list inside
    // DSS's own AbstractRunnableAnalysis and accepted the list's content anyway, with zero
    // rejection recorded: unverified content reaching the served set, exactly what
    // NFR-S-227-01 exists to prevent. The original comment here ("only used by the fixture
    // smoke check") was wrong — DssOfficialTrustListAdapter never calls TLValidatorTask
    // directly, but TLValidationJob does, on every real refresh.
    implementation 'eu.europa.ec.joinup.sd-dss:dss-validation:6.4'
    // dss-policy-jaxb provides the default constraint-policy loader TLValidatorTask needs at
    // runtime; same production scope as dss-validation just above, for the same reason
    // (TLValidationJob runs TLValidatorTask internally on every real refresh).
    runtimeOnly 'eu.europa.ec.joinup.sd-dss:dss-policy-jaxb:6.4'
    // DSS delegates string/collection utilities and CRL parsing to a runtime
    // implementation module; without one it fails at startup, not at compile time.
    runtimeOnly 'eu.europa.ec.joinup.sd-dss:dss-utils-apache-commons:6.4'
    runtimeOnly 'eu.europa.ec.joinup.sd-dss:dss-crl-parser-x509crl:6.4'

    // --- Cryptography ---
    implementation 'com.nimbusds:nimbus-jose-jwt:10.9.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'

    // --- Documentation ---
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // --- Caching ---
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // --- Observability ---
    // No spring-boot-starter-aop: nothing here uses AOP, and Boot 4 stops
    // managing that starter — leaving it in would be one more thing to unpick
    // during the migration. See docs/architecture.md AD-8.
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

    // --- DevTools ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- Testing ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'

    // --- Integration Testing ---
    // Testcontainers is the validation strategy while there is no deployed
    // environment: the image itself is exercised, not a mock of it.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.awaitility:awaitility'
}

configurations.configureEach {
    exclude module: 'slf4j-simple'
}

// --- Quality & CI ---

sonar {
    properties {
        property 'sonar.projectKey', 'in2workspace_eudistack-core-trust-registry'
        property 'sonar.organization', 'in2workspace'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.sources', 'src/main/java,src/main/resources'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.coverage.exclusions',
                'src/main/java/**/TrustRegistryApplication.java'
    }
}

checkstyle {
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

checkstyleMain {
    source = 'src/main/java'
}

checkstyleTest {
    source = 'src/test/java'
}

// --- Tasks ---

// Spring Boot builds both the executable jar and a "-plain" one. The image copies
// build/libs/*.jar, so leaving both makes that COPY ambiguous and the image build
// fails with "when using COPY with more than one source file...". Nothing consumes
// the plain jar, so it is switched off rather than worked around in the Dockerfile.
tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform {
        // Container tests build and boot the Docker image, which takes minutes.
        // Keeping them out of `test` leaves the inner loop fast; CI runs them
        // through the `integrationTest` task below.
        excludeTags 'container'
    }
    // Mockito's inline mock maker (needed to mock concrete classes such as DSS's
    // TLValidationJob) self-attaches a Java agent at runtime. JDK 25 disallows that
    // by default and fails silently — mocked fields come back null instead of an
    // exception — unless the running JVM opts back in explicitly.
    jvmArgs('-XX:+EnableDynamicAgentLoading')
    finalizedBy(tasks.jacocoTestReport)
}

// Exercises the packaged image itself via Testcontainers. While there is no
// deployed environment, this is what stands in for a smoke test against one.
tasks.register('integrationTest', Test) {
    description = 'Runs the Testcontainers integration tests (tag: container).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'container'
    }
    shouldRunAfter(tasks.named('test'))
}

tasks.jacocoTestReport {
    dependsOn(tasks.test)
    reports {
        xml.required.set(true)
        csv.required.set(false)
        html.outputLocation.set(layout.buildDirectory.dir('jacocoHtml'))
    }
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
                "**/TrustRegistryApplication.class",
                "**/enums/**"
        ])
    }))
}

def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        isNonStable(it.candidate.version)
    }
}
