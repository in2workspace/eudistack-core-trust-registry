# Local development stack. The platform stack in eudistack-platform-dev consumes
# this service; run it standalone only while working on the registry itself.
services:
  trust-registry:
    build:
      context: .
      args:
        SKIP_TESTS: "true"
    container_name: trust-registry
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      LOG_LEVEL: DEBUG
      TRUST_REGISTRY_CACHE_DIR: /var/cache/trust-registry
      # Disposable dev-only signing key. NEVER use in staging/production —
      # application.yaml has no default for these three variables on purpose, so an
      # environment that forgets to set them fails to start rather than silently signing
      # with a key anyone with repo read access already has. The keystore itself is a test
      # fixture (src/test/resources, never src/main/resources — quality-report.md B1: a
      # signing keystore packaged into the production jar is a committed private key) and is
      # mounted below, outside the image, rather than referenced via classpath:.
      TRUST_REGISTRY_SIGNING_KEYSTORE_PATH: file:/run/secrets/dev-signing-keystore.p12
      TRUST_REGISTRY_SIGNING_KEYSTORE_PASSWORD: dev-signing-password
      TRUST_REGISTRY_SIGNING_KEY_ALIAS: trust-registry-dev
      # DEVELOPMENT enables the unsigned /snapshot/plain diagnostic endpoint (AD-6). The
      # application.yaml baseline default is PRODUCTION (strict); this override is local-dev
      # only and lives here, never in application.yaml.
      TRUST_REGISTRY_TRUST_PROFILE: DEVELOPMENT
    volumes:
      - trust-registry-cache:/var/cache/trust-registry
      - ./src/test/resources/fixtures/snapshot/keystore/dev-signing-keystore.p12:/run/secrets/dev-signing-keystore.p12:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  trust-registry-cache:
