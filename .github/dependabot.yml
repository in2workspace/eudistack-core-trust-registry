version: 2
updates:
  # Gradle dependencies (security updates only)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
      # DSS ships its modules as one release train: bumping them separately
      # produces a build with mixed versions that fails at runtime, so they
      # must always travel in a single pull request.
      dss:
        patterns:
          - "eu.europa.ec.joinup.sd-dss:*"
      # Everything else that is not a major bump arrives grouped, so routine
      # maintenance is one review instead of a dozen.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
